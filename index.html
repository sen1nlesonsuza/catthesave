function update(){animT+=.016;if(screen!=='game')return;Object.keys(activePower).forEach(k=>{if(activePower[k]>0)activePower[k]--});catX=clamp(catX,40,W-40);if(!ball.playing){ball.x=catX;ball.y=H-119;return}ball.trail.push({x:ball.x,y:ball.y,a:1});if(ball.trail.length>10)ball.trail.shift();ball.trail.forEach(t=>t.a*=.92);const slow=activePower.slow>0?.58:1;ball.x+=ball.vx*slow;ball.y+=ball.vy*slow;ball.vx*=.998;ball.vy+=.22;
