<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cat The Save</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:system-ui}body{display:grid;place-items:center}#game{width:min(100vw,450px);height:min(100vh,800px);overflow:hidden;background:#081126;box-shadow:0 25px 80px #000;border-radius:24px}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><div id="game"><canvas id="c"></canvas></div><script>
'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),W=450,H=800,D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;x.scale(D,D);let state='menu',score=0,level=1,catX=W/2,bricks=[],parts=[];let ball={x:W/2,y:H-145,vx:0,vy:0,r:10,active:false};try{level=JSON.parse(localStorage.getItem('cts')||'{}').level||1}catch(e){}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}function t(s,a,b,z,col='#fff',al='center',wt=700){x.font=wt+' '+z+'px system-ui';x.fillStyle=col;x.textAlign=al;x.textBaseline='middle';x.fillText(s,a,b)}
function resetBall(){ball={x:catX,y:H-145,vx:0,vy:0,r:10,active:false}}
function levelGen(){bricks=[];const rows=6,cols=7;for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){const hp=1+Math.floor((level-1)/3)+(r%3===2?1:0);bricks.push({x:34+q*64,y:125+r*57,w:50,h:38,hp,max:hp,h:(r*45+q*28+level*18)%360})}resetBall()}
function start(){score=0;level=level||1;levelGen();state='game'}function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111d42');g.addColorStop(1,'#040714');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<70;i++){x.globalAlpha=.2+(i%5)/10;x.fillStyle='#fff';x.fillRect((i*73)%W,(i*137)%H,1,1)}x.globalAlpha=1}
function cat(a,b,s=1){x.save();x.translate(a,b);x.scale(s,s);x.shadowColor='#f59e0b';x.shadowBlur=20;x.fillStyle='#f59e0b';x.beginPath();x.arc(0,0,43,0,7);x.fill();x.shadowBlur=0;x.beginPath();x.moveTo(-31,-28);x.lineTo(-43,-66);x.lineTo(-11,-47);x.closePath();x.fill();x.beginPath();x.moveTo(31,-28);x.lineTo(43,-66);x.lineTo(11,-47);x.closePath();x.fill();x.fillStyle='#111827';x.beginPath();x.arc(-15,-6,6,0,7);x.arc(15,-6,6,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-13,-8,2,0,7);x.arc(17,-8,2,0,7);x.fill();x.fillStyle='#fb7185';x.beginPath();x.arc(0,11,5,0,7);x.fill();x.restore()}
function btn(y,a,b){rr(55,y,340,64,18);x.fillStyle='#151f3b';x.fill();x.strokeStyle='rgba(255,255,255,.12)';x.stroke();t(a,W/2,y+24,17);t(b,W/2,y+46,10,'#8290ae','center',600)}function menu(){t('CAT THE SAVE',W/2,85,36,'#ffd166','center',900);cat(W/2,250,1.35);btn(360,'OYNA','Tek tıkla fırlat • '+(bricks.length||42)+' düşman');t('2D ULTRA • BÖLÜM '+level,W/2,650,11,'#66738f')}
function game(){rr(14,14,422,48,15);x.fillStyle='rgba(255,255,255,.06)';x.fill();t('SKOR '+score,28,38,12,'#fff','left');t('BÖLÜM '+level,W/2,38,12,'#cbd5e1');t('DÜŞMAN '+bricks.length,422,38,11,'#fb7185','right');for(const b of bricks){const g=x.createLinearGradient(b.x-b.w/2,b.y-b.h/2,b.x+b.w/2,b.y+b.h/2);g.addColorStop(0,'hsl('+b.h+' 85% 62%)');g.addColorStop(1,'hsl('+b.h+' 75% 40%)');x.fillStyle=g;rr(b.x-b.w/2,b.y-b.h/2,b.w,b.h,10);x.fill();x.strokeStyle='rgba(255,255,255,.18)';x.stroke();t(b.hp,b.x,b.y,12)}for(const p of parts){x.globalAlpha=p.a;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill()}x.globalAlpha=1;const py=H-105;x.fillStyle='#1e293b';rr(catX-60,py,120,15,8);x.fill();cat(catX,H-65,.7);x.shadowColor='#fff';x.shadowBlur=15;x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.shadowBlur=0;if(!ball.active)t('EKRANA TEK TIKLA → TOP İLERLESİN',W/2,H-155,12,'#a8b4cc')}
function explode(a,b,h){for(let i=0;i<10;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*6,vy:(Math.random()-.7)*6,a:1,s:2+Math.random()*3,c:'hsl('+h+' 90% 65%)'})}
function autoAimAndLaunch(px){if(ball.active||bricks.length===0)return;catX=clamp(px,65,W-65);ball.x=catX;let target=bricks.reduce((best,b)=>Math.abs(b.x-catX)<Math.abs(best.x-catX)?b:best,bricks[0]);let dx=target.x-ball.x,dy=target.y-ball.y,len=Math.hypot(dx,dy)||1;let speed=12;ball.vx=dx/len*speed;ball.vy=dy/len*speed;if(ball.vy>-3)ball.vy=-Math.abs(ball.vy)-3;ball.active=true}
function update(){if(state!=='game')return;for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.a-=.03}parts=parts.filter(p=>p.a>0);if(!ball.active)return;ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.10;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<72){ball.y=72;ball.vy=Math.abs(ball.vy)}for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(Math.abs(ball.x-b.x)<b.w/2+ball.r&&Math.abs(ball.y-b.y)<b.h/2+ball.r){b.hp--;score+=10;explode(b.x,b.y,b.h);if(Math.abs(ball.x-b.x)>Math.abs(ball.y-b.y))ball.vx*=-1;else ball.vy*=-1;if(b.hp<=0){score+=25;explode(b.x,b.y,b.h);bricks.splice(i,1)}break}}
// Top geri döndüğünde otomatik yakalanır; ASLA kendi kendine tekrar fırlamaz.
if(ball.y>H-120&&ball.vy>0){ball.y=H-145;ball.x=catX;ball.vx=0;ball.vy=0;ball.active=false}
if(bricks.length===0){level++;localStorage.setItem('cts',JSON.stringify({level}));state='win';ball.active=false}}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}c.addEventListener('pointerdown',e=>{const p=pos(e);if(state==='menu'&&p.y>350&&p.y<430){start();return}if(state==='game'&&!ball.active){autoAimAndLaunch(p.x)}else if(state==='win'||state==='lose'){if(p.y>500&&p.y<600)start();else if(p.y>620)state='menu'}});c.addEventListener('pointermove',e=>{if(state==='game'&&!ball.active&&e.buttons){const p=pos(e);catX=clamp(p.x,65,W-65)}});function draw(){bg();if(state==='menu')menu();else if(state==='game')game();else{t(state==='win'?'BÖLÜM TAMAMLANDI':'OYUN BİTTİ',W/2,220,28,state==='win'?'#22c55e':'#ef4444','center',900);cat(W/2,350,1.2);t('SKOR '+score,W/2,450,18);rr(65,510,320,60,16);x.fillStyle='#1e2b4b';x.fill();t(state==='win'?'SONRAKİ BÖLÜM':'TEKRAR DENE',W/2,540,16);rr(65,625,320,55,16);x.fillStyle='#121b32';x.fill();t('ANA MENÜ',W/2,652,14)}}function loop(){update();draw();requestAnimationFrame(loop)}levelGen();loop();</script></body></html>
