<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CAT THE SAVE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;font-family:Arial,sans-serif;color:#fff}body{display:grid;place-items:center}.app{width:min(100vw,520px);height:min(100vh,900px);position:relative;overflow:hidden;background:#102b3e;border:2px solid #5f7787;border-radius:12px;box-shadow:0 24px 70px #000}.screen{position:absolute;inset:0}.hidden{display:none!important}.top{height:58px;background:#132b40;border-bottom:2px solid #526b7c;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:5}.title{font-weight:1000;letter-spacing:1px}.wallet{background:#091a29;border:1px solid #5e7585;border-radius:9px;padding:7px 10px;font-weight:900}.menu{height:calc(100% - 58px);position:relative;background:linear-gradient(#75b2c9,#3d7386 45%,#19394b 70%,#0b1927);overflow:hidden}.cloud{position:absolute;color:#fff;font-size:36px;opacity:.85}.c1{top:24px;left:25px}.c2{top:75px;right:15px;font-size:25px}.buildings{position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(90deg,#19374a 0 12%,transparent 12% 18%,#284b5c 18% 30%,transparent 30% 38%,#183649 38% 52%,transparent 52% 61%,#2b5061 61% 73%,transparent 73% 80%,#173548 80%)}.logo{position:absolute;top:95px;width:100%;text-align:center;font-size:58px;line-height:.72;font-weight:1000;color:#ffb71b;text-shadow:4px 5px 0 #593006,-2px -2px #fff}.logo small{display:block;color:#fff;font-size:30px;text-shadow:3px 3px #17455d}.heroCat{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);font-size:135px;filter:drop-shadow(0 12px 4px #10222d)}.play{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);border:2px solid #774b08;border-radius:15px;background:linear-gradient(#ffdc62,#eda915);box-shadow:0 5px #684306;color:#241500;font-size:23px;font-weight:1000;padding:13px 65px;cursor:pointer}.game{height:calc(100% - 58px);position:relative;background:linear-gradient(#315f76,#173c50 55%,#0b1c2a);overflow:hidden}.game canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{height:56px;position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;pointer-events:none}.badge{background:#0b1d2d;border:1px solid #607888;border-radius:8px;padding:7px 9px;font-weight:900;font-size:12px}.hint{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:4;background:#071827dd;border:1px solid #6b8290;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:900;pointer-events:none;white-space:nowrap}.pause{position:absolute;right:10px;top:66px;z-index:6;background:#142d40;border:1px solid #708494;color:#fff;border-radius:8px;padding:8px 11px;font-weight:900}.overlay{position:absolute;inset:0;z-index:10;background:#07111ed9;display:grid;place-items:center;text-align:center}.card{width:82%;background:linear-gradient(#1a4058,#0d2435);border:1px solid #718696;border-radius:15px;padding:28px;box-shadow:0 15px 50px #000}.card h2{margin:0 0 12px;color:#ffd04a}.smallbtn{border:1px solid #6b8291;background:#17384d;color:#fff;border-radius:9px;padding:10px 22px;font-weight:900;cursor:pointer;margin:5px}.toast{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);z-index:20;background:#071827;border:1px solid #7d94a3;padding:9px 14px;border-radius:9px;font-weight:900;display:none}@media(max-height:650px){.logo{top:55px;font-size:45px}.heroCat{font-size:100px;bottom:62px}.play{bottom:14px}.hint{bottom:58px}}</style></head><body><div class="app"><div class="screen" id="menu"><div class="top"><div class="title">CAT THE SAVE • 2D</div><div class="wallet">🪙 12.450</div></div><div class="menu"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="buildings"></div><div class="logo">CAT<small>THE</small>SAVE</div><div class="heroCat">🐱</div><button class="play" id="playBtn">OYNA ▶</button></div></div><div class="screen hidden" id="gameScreen"><div class="top"><button class="smallbtn" id="menuBtn">‹ MENÜ</button><div class="title">BÖLÜM <span id="level">1</span></div><div class="wallet">🪙 <span id="score">0</span></div></div><div class="game" id="field"><canvas id="cv"></canvas><div class="hud"><span class="badge" id="hp">❤️❤️❤️</span><span class="badge">DÜŞMAN <b id="enemyCount">0</b></span></div><button class="pause" id="pauseBtn">Ⅱ</button><div class="hint" id="hint">DOKUN VE SÜRÜKLE → ATIŞ YÖNÜNÜ SEÇ</div><div class="overlay hidden" id="pause"><div class="card"><h2>DURAKLATILDI</h2><button class="smallbtn" id="resumeBtn">DEVAM ET</button><button class="smallbtn" id="pauseMenuBtn">MENÜ</button></div></div><div class="overlay hidden" id="end"><div class="card"><div id="endEmoji" style="font-size:65px">🐱</div><h2 id="endTitle">BÖLÜM TAMAMLANDI</h2><p id="endText"></p><button class="smallbtn" id="againBtn">TEKRAR OYNA</button><button class="smallbtn" id="endMenuBtn">MENÜ</button></div></div></div></div><div class="toast" id="toast"></div><script>'use strict';const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),field=document.getElementById('field');let W,H,dpr=1,state='menu',paused=false,score=0,level=1,lives=3,turn=0,bricks=[],particles=[],aim=null,drag=false,last=0;let ball={x:0,y:0,vx:0,vy:0,r:7,active:false};const animals=['🐺','🦊','🦁','🐯'];const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){const r=field.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!ball.active)ball.y=H-78}window.addEventListener('resize',resize);resize();function makeBlock(i,row,col,hp){return{x:46+col*(W-92)/3,y:105+row*62,w:58,h:38,hp,max:hp,hue:(i*47+level*23)%360,animal:animals[(i+level)%animals.length]}}function wave(baseHp=1){bricks=[];const count=Math.min(8,5+Math.floor(level/2));for(let i=0;i<count;i++){const col=i%4,row=Math.floor(i/4);const hp=Math.min(99,baseHp+Math.floor(i/4));bricks.push(makeBlock(i,row,col,hp))}updateHud()}function start(){score=0;level=1;lives=3;turn=0;state='game';paused=false;wave(1);resetBall();$('menu').classList.add('hidden');$('gameScreen').classList.remove('hidden');$('pause').classList.add('hidden');$('end').classList.add('hidden');$('hint').style.display='block';resize()}function resetBall(){ball={x:W/2,y:H-78,vx:0,vy:0,r:7,active:false};aim=null;drag=false}function menu(){state='menu';$('gameScreen').classList.add('hidden');$('menu').classList.remove('hidden')}function updateHud(){$('score').textContent=score;$('level').textContent=level;$('enemyCount').textContent=bricks.length;$('hp').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}function pointer(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function setAim(p){if(ball.active||paused)return;let dx=p.x-ball.x,dy=p.y-ball.y;if(dy>=-10)return;const l=Math.hypot(dx,dy)||1;aim={x:ball.x+dx/l*145,y:ball.y+dy/l*145}}function launch(){if(!aim||ball.active||paused)return;const dx=aim.x-ball.x,dy=aim.y-ball.y,l=Math.hypot(dx,dy)||1,speed=9;ball.vx=dx/l*speed;ball.vy=dy/l*speed;ball.active=true;aim=null;$('hint').style.display='none'}cv.addEventListener('pointerdown',e=>{if(state!=='game'||paused)return;drag=true;setAim(pointer(e));cv.setPointerCapture?.(e.pointerId)});cv.addEventListener('pointermove',e=>{if(drag&&!ball.active&&!paused)setAim(pointer(e))});cv.addEventListener('pointerup',()=>{if(drag){drag=false;launch()}});cv.addEventListener('pointercancel',()=>{drag=false});function burst(x,y,h){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.6)*5,a:1,h})}function moveBlocksDown(){for(const b of bricks)b.y+=58;turn++;if(bricks.some(b=>b.y+b.h/2>H-150)){endGame(false);return}spawnRearEnemies();updateHud();toast('⬇️ Düşmanlar ilerledi! Yeni düşmanlar arkadan geliyor.')}function spawnRearEnemies(){const existing=bricks.length;const add=Math.min(3,8-existing);if(add<=0)return;const strongest=bricks.reduce((m,b)=>Math.max(m,b.hp),1);const rearHp=strongest+2+Math.floor(turn/2);const cols=[0,1,2,3].sort(()=>Math.random()-.5);for(let i=0;i<add;i++){const col=cols[i];const b=makeBlock(existing+i,0,col,rearHp+i);b.y=78;b.x=46+col*(W-92)/3;bricks.push(b)}}function endGame(win){state='end';$('end').classList.remove('hidden');$('endTitle').textContent=win?'BÖLÜM TAMAMLANDI':'YAKALANDIN!';$('endEmoji').textContent=win?'🎉':'🐱';$('endText').textContent=win?'Yeni bölüm için devam et.':'Düşmanlar çok aşağı indi.'}function update(dt){if(state!=='game'||paused)return;particles.forEach(p=>{p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.08*dt*60;p.a-=.035*dt*60});particles=particles.filter(p=>p.a>0);if(!ball.active)return;ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.vy+=.012*dt*60;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<65){ball.y=65;ball.vy=Math.abs(ball.vy)}for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(Math.abs(ball.x-b.x)<b.w/2+ball.r&&Math.abs(ball.y-b.y)<b.h/2+ball.r){b.hp=Math.max(0,b.hp-1);score+=10;burst(b.x,b.y,b.hue);if(Math.abs(ball.x-b.x)>Math.abs(ball.y-b.y))ball.vx*=-1;else ball.vy*=-1;if(b.hp<=0){score+=25;burst(b.x,b.y,b.hue);bricks.splice(i,1)}updateHud();break}}if(bricks.length===0){level++;turn=0;wave(Math.max(1,level));resetBall();$('hint').style.display='block';toast('✨ Yeni dalga!')}if(ball.y>H-45&&ball.vy>0){ball.x=clamp(ball.x,35,W-35);ball.y=H-78;ball.vx=0;ball.vy=0;ball.active=false;aim=null;moveBlocksDown();if(state==='game')$('hint').style.display='block'}}function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#315f76');g.addColorStop(.55,'#173c50');g.addColorStop(1,'#081925');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<35;i++){ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect((i*73)%W,(i*117)%H,1,1)}for(const b of bricks){const gr=ctx.createLinearGradient(b.x-b.w/2,b.y-b.h/2,b.x+b.w/2,b.y+b.h/2);gr.addColorStop(0,`hsl(${b.hue} 80% 65%)`);gr.addColorStop(1,`hsl(${b.hue} 70% 38%)`);ctx.fillStyle=gr;round(b.x-b.w/2,b.y-b.h/2,b.w,b.h,10);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.32)';ctx.stroke();ctx.font='29px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.animal,b.x,b.y-5);ctx.fillStyle='#ffd34d';ctx.font='900 12px Arial';ctx.fillText(b.hp,b.x,b.y+17)}for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=`hsl(${p.h} 90% 65%)`;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(!ball.active&&aim){ctx.strokeStyle='#ffd34d';ctx.lineWidth=3;ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([]);const a=Math.atan2(aim.y-ball.y,aim.x-ball.x);ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.moveTo(aim.x,aim.y);ctx.lineTo(aim.x-14*Math.cos(a-.5),aim.y-14*Math.sin(a-.5));ctx.lineTo(aim.x-14*Math.cos(a+.5),aim.y-14*Math.sin(a+.5));ctx.closePath();ctx.fill()}ctx.shadowColor='#fff';ctx.shadowBlur=15;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font='70px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐱',ball.x,H-32)}function round(a,b,w,h,r){ctx.beginPath();ctx.moveTo(a+r,b);ctx.arcTo(a+w,b,a+w,b+h,r);ctx.arcTo(a+w,b+h,a,b+h,r);ctx.arcTo(a,b+h,a,b,r);ctx.arcTo(a,b,a+w,b,r);ctx.closePath()}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1300)}function loop(t){const dt=Math.min(.025,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);$('playBtn').onclick=start;$('menuBtn').onclick=menu;$('pauseBtn').onclick=()=>{if(state==='game'){paused=!paused;$('pause').classList.toggle('hidden',!paused)}};$('resumeBtn').onclick=()=>{$('pause').classList.add('hidden');paused=false};$('pauseMenuBtn').onclick=menu;$('againBtn').onclick=start;$('endMenuBtn').onclick=menu;</script></body></html>
