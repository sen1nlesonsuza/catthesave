<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cat The Save</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}#game{position:relative;width:min(100vw,450px);height:min(100vh,800px);overflow:hidden;background:#081126;box-shadow:0 25px 80px #000;border-radius:24px}canvas{display:block;width:100%;height:100%;touch-action:none}#err{display:none;position:absolute;inset:20px;background:#160b12;border:1px solid #ef4444;border-radius:16px;padding:20px;color:#fecaca;z-index:9;font:14px monospace;white-space:pre-wrap}</style>
</head>
<body><div id="game"><canvas id="c"></canvas><div id="err"></div></div>
<script>
'use strict';
(function(){
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),err=document.getElementById('err');
if(!ctx){err.style.display='block';err.textContent='Canvas desteklenmiyor.';return;}
const W=450,H=800,DPR=Math.min(2,window.devicePixelRatio||1);canvas.width=W*DPR;canvas.height=H*DPR;ctx.scale(DPR,DPR);
const saveKey='cat_save_ultra';
let saveData={gold:0,level:1,high:0};try{saveData=Object.assign(saveData,JSON.parse(localStorage.getItem(saveKey)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(saveKey,JSON.stringify(saveData))}catch(e){}}
let state='menu',score=0,lives=3,level=saveData.level||1,catX=W/2,ball={x:W/2,y:H-145,vx:0,vy:0,r:9,active:false},aim=null,bricks=[],particles=[],stars=[];
for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6,a:.2+Math.random()*.7});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rounded(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,color='#fff',align='center',weight=700){ctx.font=weight+' '+size+'px system-ui,sans-serif';ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function makeLevel(){bricks=[];const rows=Math.min(6,3+Math.floor((level-1)/2));const cols=5;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level>3&&Math.random()<.12)continue;const hp=1+Math.floor((level-1)/3)+(r%2);bricks.push({x:45+c*90,y:125+r*62,w:72,h:42,hp,max:hp,hue:(r*55+c*25+level*20)%360})}ball={x:catX,y:H-145,vx:0,vy:0,r:9,active:false};aim=null;particles=[]}
function start(){score=0;lives=3;level=saveData.level||1;makeLevel();state='game'}
function menuButton(y,label,sub){rounded(55,y,340,64,18);ctx.fillStyle='#151f3b';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.stroke();txt(label,W/2,y+24,17,'#fff');txt(sub,W/2,y+46,10,'#8290ae', 'center',600)}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111d42');g.addColorStop(.55,'#080f24');g.addColorStop(1,'#040714');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawCat(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.shadowColor='rgba(245,158,11,.55)';ctx.shadowBlur=22;ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(0,0,43,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(-31,-28);ctx.lineTo(-43,-66);ctx.lineTo(-11,-47);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(31,-28);ctx.lineTo(43,-66);ctx.lineTo(11,-47);ctx.closePath();ctx.fill();ctx.fillStyle='#fde68a';ctx.beginPath();ctx.moveTo(-31,-43);ctx.lineTo(-37,-58);ctx.lineTo(-20,-48);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(31,-43);ctx.lineTo(37,-58);ctx.lineTo(20,-48);ctx.closePath();ctx.fill();ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(-15,-6,6,0,Math.PI*2);ctx.arc(15,-6,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-13,-8,2,0,Math.PI*2);ctx.arc(17,-8,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(0,11,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111827';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(-13,21);ctx.moveTo(0,16);ctx.lineTo(13,21);ctx.moveTo(0,19);ctx.lineTo(-11,27);ctx.moveTo(0,19);ctx.lineTo(11,27);ctx.stroke();ctx.restore()}
function drawMenu(){txt('CAT THE SAVE',W/2,82,36,'#ffd166','center',900);txt('Kedini kurtar. Topu ustaca kontrol et.',W/2,113,12,'#8d9ab8');drawCat(W/2,245,1.35);menuButton(355,'OYNA','Bölüm '+level+' • yüksek skor '+saveData.high);menuButton(435,'NASIL OYNANIR','Sürükle, nişan al, bırak');menuButton(515,'SIFIRLA','İlerlemeyi baştan başlat');txt('ALTIN  '+saveData.gold,W/2,620,12,'#ffd166');txt('2D ULTRA EDITION • 60 FPS',W/2,680,10,'#53617d')}
function drawHud(){rounded(14,14,422,48,15);ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();txt('SKOR '+score,28,38,12,'#fff','left',800);txt('BÖLÜM '+level,W/2,38,12,'#cbd5e1');txt('CAN '+lives,422,38,12,'#fb7185','right',800)}
function drawGame(){drawHud();for(const b of bricks){const g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);g.addColorStop(0,'hsl('+b.hue+' 85% 62%)');g.addColorStop(1,'hsl('+b.hue+' 75% 40%)');ctx.fillStyle=g;rounded(b.x-b.w/2,b.y-b.h/2,b.w,b.h,12);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';rounded(b.x-b.w/2+2,b.y-b.h/2+2,b.w-4,10,9);ctx.fill();txt(b.hp,b.x,b.y+2,14,'#fff')}
for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
const py=H-105,pw=120;ctx.fillStyle='#1e293b';rounded(catX-pw/2,py,pw,15,8);ctx.fill();ctx.fillStyle='#64748b';rounded(catX-pw/2,py,pw,5,8);ctx.fill();drawCat(catX,H-65,.7);
ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
if(!ball.active){txt('TOPU YUKARI SÜRÜKLE',W/2,H-155,11,'#a8b4cc');}if(aim){ctx.strokeStyle='rgba(255,209,102,.85)';ctx.setLineDash([7,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(catX,H-145);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([])}}
function explode(x,y,h){for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,a:1,s:2+Math.random()*3,c:'hsl('+h+' 90% 65%)'})}
function update(){if(state!=='game')return;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.a-=.025}particles=particles.filter(p=>p.a>0);if(!ball.active)return;ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.12;
if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<70){ball.y=70;ball.vy=Math.abs(ball.vy)}
const py=H-105,pw=120;if(ball.vy>0&&ball.y+ball.r>py&&ball.y<py+20&&Math.abs(ball.x-catX)<pw/2+ball.r){ball.y=py-ball.r;ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-catX)*.055}
for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(Math.abs(ball.x-b.x)<b.w/2+ball.r&&Math.abs(ball.y-b.y)<b.h/2+ball.r){b.hp--;score+=10;saveData.gold++;explode(b.x,b.y,b.hue);if(Math.abs(ball.x-b.x)>Math.abs(ball.y-b.y))ball.vx*=-1;else ball.vy*=-1;if(b.hp<=0){score+=25;explode(b.x,b.y,b.hue);bricks.splice(i,1)}break}}
if(ball.y>H+30){lives--;if(lives<=0){saveData.high=Math.max(saveData.high,score);persist();state='lose'}else{ball={x:catX,y:H-145,vx:0,vy:0,r:9,active:false};aim=null}}
if(bricks.length===0){score+=lives*50;saveData.high=Math.max(saveData.high,score);saveData.level=++level;persist();state='win'} }
function pointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
canvas.addEventListener('pointerdown',e=>{const p=pointer(e);canvas.setPointerCapture(e.pointerId);if(state==='menu'){if(p.y>350&&p.y<425)start();else if(p.y>510&&p.y<590){saveData={gold:0,level:1,high:0};level=1;persist()}}else if(state==='game'){if(p.y>H-170){catX=clamp(p.x,65,W-65);if(!ball.active)ball.x=catX}else if(!ball.active){aim={x:p.x,y:p.y}}else{catX=clamp(p.x,65,W-65)}}else if(state==='win'||state==='lose'){if(p.y>500&&p.y<600){if(state==='lose')start();else{makeLevel();state='game'}}else if(p.y>620)state='menu'}});
canvas.addEventListener('pointermove',e=>{if(state!=='game')return;const p=pointer(e);if(p.y>H-180)catX=clamp(p.x,65,W-65);if(aim&&!ball.active)aim={x:p.x,y:p.y}});
canvas.addEventListener('pointerup',e=>{if(state==='game'&&!ball.active&&aim){const dx=catX-aim.x,dy=H-145-aim.y,len=Math.hypot(dx,dy);if(len>12){const power=clamp(len/28,.7,1.5),a=Math.atan2(dy,dx);ball.vx=Math.cos(a)*8*power;ball.vy=Math.sin(a)*8*power;if(ball.vy>-3)ball.vy=-5*power;ball.active=true}aim=null}});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')catX=clamp(catX-20,65,W-65);if(e.key==='ArrowRight')catX=clamp(catX+20,65,W-65);if(e.key==='Escape'&&state==='game'){ball.active=false;state='menu'}});
function draw(){drawBackground();if(state==='menu')drawMenu();else if(state==='game')drawGame();else{txt(state==='win'?'BÖLÜM TAMAMLANDI':'OYUN BİTTİ',W/2,220,27,state==='win'?'#22c55e':'#ef4444','center',900);drawCat(W/2,350,1.2);txt('SKOR '+score,W/2,450,18,'#fff');rounded(65,510,320,60,16);ctx.fillStyle='#1e2b4b';ctx.fill();txt(state==='win'?'SONRAKİ BÖLÜM':'TEKRAR DENE',W/2,540,16,'#fff');rounded(65,625,320,55,16);ctx.fillStyle='#121b32';ctx.fill();txt('ANA MENÜ',W/2,652,14,'#aab5ca')}}
function loop(){update();draw();requestAnimationFrame(loop)}
window.addEventListener('error',e=>{err.style.display='block';err.textContent='Oyun hatası:\n'+e.message});
makeLevel();loop();
})();
</script>
</body>
</html>
